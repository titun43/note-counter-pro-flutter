name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses
        # NDK r30 — latest, fully supports 16 KB memory page sizes.
        # Required by Google Play from Nov 2025.
        sdkmanager "ndk;30.0.16248370" || true
        # Also install r28 as fallback
        sdkmanager "ndk;28.0.12674087" || true
        echo "=== Installed NDK versions ==="
        ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo "No NDK found"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        # Flutter 3.44.9 — Dart 3.12.2 (required by in_app_purchase_android 0.5.5
        # which uses Play Billing Library 9.1.0; Google Play mandates >= 8.0.0
        # since 1 Nov 2026). The 16 KB alignment diagnostic step below will
        # verify .so files. If it FAILs, fall back to 3.35.5 + remove IAP.
        flutter-version: '3.44.9'
        channel: stable
        cache: true

    - name: Clean build cache
      run: flutter clean && flutter pub get

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Print SHA-1 fingerprint (for Firebase Console)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "========================================="
        echo "  SHA-1 FINGERPRINT FOR FIREBASE CONSOLE"
        echo "========================================="
        keytool -list -v -keystore android/app/note-counter-pro.keystore -alias ${{ secrets.KEY_ALIAS }} -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} 2>/dev/null | grep -E "SHA1|SHA-256|Valid until|Owner"
        echo "========================================="
        echo "  Copy the SHA1 line above and add it to:"
        echo "  Firebase Console > Project Settings > Your apps > Add fingerprint"
        echo "========================================="

    - name: Clean build cache
      run: flutter clean && flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm64,android-x64

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons --target-platform android-arm64,android-x64

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Diagnose 16 KB alignment (fixed for 64-bit ELF)
      run: |
        echo "=== Checking ALL .so files for 16 KB alignment ==="
        mkdir -p /tmp/aab-check && cd /tmp/aab-check
        unzip -o -q $GITHUB_WORKSPACE/note-counter-pro.aab
        echo ""
        echo "=== .so files found ==="
        find . -name "*.so" | sort
        echo ""
        for f in $(find . -name "*.so" | sort); do
          echo "--- $f ---"
          # For 64-bit ELF, readelf -l shows LOAD on two lines.
          # Use objdump -p which shows alignment on one line.
          if command -v objdump &>/dev/null; then
            objdump -p "$f" 2>/dev/null | grep "LOAD" | head -3
            # Extract the last field (alignment) from each LOAD line
            ALIGNS=$(objdump -p "$f" 2>/dev/null | grep "LOAD" | awk '{print $NF}' | sort -u)
            echo "Alignments: $ALIGNS"
            # Check if any alignment < 0x4000 (16 KB)
            FAIL=0
            for a in $ALIGNS; do
              # Convert hex to decimal
              DEC=$(printf "%d" "$a" 2>/dev/null || echo 0)
              if [ "$DEC" -lt 16384 ] 2>/dev/null; then
                FAIL=1
              fi
            done
            if [ "$FAIL" -eq 1 ]; then
              echo ">>> FAIL: alignment < 16 KB"
            else
              echo ">>> PASS: all alignments >= 16 KB"
            fi
          else
            echo "objdump not available"
          fi
          echo ""
        done

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Extract version from pubspec.yaml (e.g. "3.13.3+83" → "3.13.3")
        VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
        VERSION_CODE=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 2)
        TAG="v${VERSION}-flutter"
        echo "Creating release with tag: $TAG (versionCode: $VERSION_CODE)"

        NOTES=$(printf '# Note Counter Pro v%s (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: %s (versionCode: %s)\n- Flutter: 3.44.9 / Dart 3.12.2\n- Target SDK: 36\n- Play Billing Library: 9.1.0 (via in_app_purchase_android 0.5.5)\n\n## Recent changes\n- Premium upgrade (In-App Purchase) re-enabled with Play Billing 9.1.0\n- Required by Google Play policy (1 Nov 2026 deadline)\n\nVersion: %s (versionCode: %s)' "$VERSION" "$VERSION" "$VERSION_CODE" "$VERSION" "$VERSION_CODE")

        # Check if release with same tag already exists, if so delete it first
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists, deleting old release..."
          gh release delete "$TAG" --yes
          # Also delete the tag
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
        fi

        gh release create "$TAG" \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v${VERSION} (Flutter - IAP Billing 9.1.0)" \
          --notes "$NOTES" \
          --latest
