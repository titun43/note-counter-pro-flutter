name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses
        sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create || true

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.10.2 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.10.2 (versionCode: 69)\n- Flutter: 3.35.5\n- Target SDK: 36\n\n## Restored: Personal Bahi Khata Book Design\n\nPrevious force push removed the v3.9.0 khata redesign. All restored.\n\n### Khata Page (khata_screen.dart):\n1. Hardcover header: Maroon/brown gradient with golden text\n2. Paper page background: Cream color with blue ruled lines\n3. Red margin line: Vertical red line on left\n4. Handwritten font: LXGW WenKai (KhataHandwriting)\n5. Numbered customer entries (1. 2. 3.)\n6. Phone privacy masking (••••12)\n7. Inline Call/WhatsApp buttons per customer\n8. 4 sort modes (balance, name, recent, date)\n9. Real-time search bar\n10. Monthly summary card\n11. Compact FAB (FloatingActionButton.small)\n\n### Customer Detail Page (customer_detail_screen.dart):\n1. Page number at top\n2. Settled stamp when balance = 0\n3. Table format: Date | Description | Took | Gave\n4. All text in khata handwriting font\n5. Date picker for transactions\n6. Settle Up button\n7. Share full page\n8. WhatsApp reminder\n9. Call button\n10. Total row with bold underlined totals\n\nVersion: 3.10.2 (versionCode: 69)')
        gh release create v3.10.2-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.10.2 (Flutter - Restored Bahi Khata Design)" \
          --notes "$NOTES" \
          --latest
