name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.0.6 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.0.6 (versionCode: 36)\n- Technology: Flutter (Dart)\n\n## 🆕 Features in 3.0.6\n\n### 1. Khata - Add Customer from Contacts\n- Add Customer button on Khata screen (FAB + AppBar)\n- Two options: Pick from Contacts / Manual Add\n- Pick from Contacts: opens native Android contact picker\n  - Selects name and phone number directly from saved contacts\n  - No need to type manually\n- Manual Add: enter name, phone, email, address manually\n- READ_CONTACTS permission added to AndroidManifest\n\n### 2. Language Switching NOW WORKS\n- Full localization system implemented\n- 3 languages with complete translations:\n  - English (en)\n  - Bengali (bn) - বাংলা\n  - Hindi (hi) - हिंदी\n- All UI strings translated: app title, navigation labels, buttons,\n  customer fields, khata labels, settings sections, dialogs, etc.\n- Changing language in Settings now updates entire app immediately\n- LocalizationProvider wraps the app - reactive updates\n- Extension method context.loc.t(key) for easy access\n\n## Features\n- Note Counter (vertical list, inline editable counts, currency selector)\n- Calculator (correct currency symbol)\n- Customer Management (premium UI, add from contacts)\n- Khata (premium UI, add customer, lend/borrow tracking)\n- Bills\n- Reports (from Settings)\n- UPI QR Code (from action bar)\n- CSV Export (from Settings)\n- Rate Us / Share App\n- Settings (language switch works, theme, etc.)\n- Dark/Light theme\n- Multi-language (English, Bengali, Hindi)')
        gh release create v3.0.6-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.0.6 (Flutter - Contact Picker + Language)" \
          --notes "$NOTES" \
          --latest
