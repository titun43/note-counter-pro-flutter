name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.0.8 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.0.8 (versionCode: 38)\n- Technology: Flutter (Dart)\n\n## 🆕 Fixes in 3.0.8\n\n### 1. Bottom Nav Redesigned (4 items)\n- Counter (home)\n- Calculator (restored to bottom nav)\n- Khata\n- Settings\n- Removed Customers and Bills from bottom nav (less clutter)\n- Customers accessible from Khata AppBar (people icon)\n- Bills accessible from Settings > Quick Actions > Bills\n- Bottom nav labels now use localized strings\n\n### 2. Calculator Back in Bottom Nav\n- User asked: CALCULETOR TA KOI, NAI KENO\n- Calculator is now the 2nd tab in bottom nav\n- Receives currency code from StorageService\n- Shows correct currency symbol\n\n### 3. Language Switching Actually Works\n- User reported: LANGUAGE TA CHANGE KORLE APP A CHANGE HOI NA\n- Fixed: MainScaffold now uses context.loc for all nav labels\n- When language changes in Settings, LocalizationProvider rebuilds\n- All screens using context.loc will update immediately\n- Bottom nav labels change instantly when language switched\n- Khata screen already fully localized\n\n## Features\n- Note Counter (vertical list, inline editable counts)\n- Calculator (bottom nav, correct currency symbol)\n- Khata (premium UI, add customer from contacts, view all customers)\n- Settings (language works, theme, quick actions)\n- UPI QR Code (from action bar)\n- CSV Export (from Settings)\n- Bills (from Settings)\n- Reports (from Settings)\n- Rate Us / Share App\n- Dark/Light theme\n- Multi-language (English, Bengali, Hindi)')
        gh release create v3.0.8-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.0.8 (Flutter - Nav + Calculator + Language Fix)" \
          --notes "$NOTES" \
          --latest
