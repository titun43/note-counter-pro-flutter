name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses
        # NDK r30 — latest, fully supports 16 KB memory page sizes.
        # Required by Google Play from Nov 2025.
        sdkmanager "ndk;30.0.16248370" || true
        # Also install r28 as fallback
        sdkmanager "ndk;28.0.12674087" || true
        echo "=== Installed NDK versions ==="
        ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo "No NDK found"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        # Flutter 3.47.8 (latest stable) ships Dart 3.13.7.
        # Required because in_app_purchase 3.3.1 needs Dart ^3.10.0
        # and in_app_purchase_android 0.5.5 (Play Billing 9.x) too.
        # Older Flutter (3.35.5) ships Dart 3.9.2 — dependency resolution fails.
        flutter-version: '3.47.8'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Print SHA-1 fingerprint (for Firebase Console)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "========================================="
        echo "  SHA-1 FINGERPRINT FOR FIREBASE CONSOLE"
        echo "========================================="
        keytool -list -v -keystore android/app/note-counter-pro.keystore -alias ${{ secrets.KEY_ALIAS }} -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} 2>/dev/null | grep -E "SHA1|SHA-256|Valid until|Owner"
        echo "========================================="
        echo "  Copy the SHA1 line above and add it to:"
        echo "  Firebase Console > Project Settings > Your apps > Add fingerprint"
        echo "========================================="

    - name: Clean build cache
      run: flutter clean && flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm64,android-x64

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons --target-platform android-arm64,android-x64

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Align AAB for 16 KB page size support
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        # Install build-tools 36.0.0 which includes zipalign with -P flag
        sdkmanager "build-tools;36.0.0" || true
        # Find zipalign (use the latest available)
        ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign 2>/dev/null | sort -V | tail -1)
        if [ -z "$ZIPALIGN" ]; then
          echo "⚠️ zipalign not found, trying build-tools/35.0.0"
          sdkmanager "build-tools;35.0.0" || true
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign 2>/dev/null | sort -V | tail -1)
        fi
        echo "Using zipalign: $ZIPALIGN"
        # Re-align the AAB with 16 KB page alignment (-P 16384)
        # This forces ALL .so files to be aligned to 16 KB page boundaries
        # within the zip, satisfying Play Console's 16 KB checker.
        $ZIPALIGN -P 16384 -f 4 note-counter-pro.aab note-counter-pro-aligned.aab
        # Verify alignment
        $ZIPALIGN -c -P 16384 4 note-counter-pro-aligned.aab && echo "16 KB alignment verified!" || echo "Alignment check failed!"
        # Replace original with aligned version
        mv -f note-counter-pro-aligned.aab note-counter-pro.aab
        echo "AAB size after alignment: $(du -h note-counter-pro.aab | cut -f1)"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Extract version from pubspec.yaml (e.g. "3.13.3+83" → "3.13.3")
        VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
        VERSION_CODE=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 2)
        TAG="v${VERSION}-flutter"
        echo "Creating release with tag: $TAG (versionCode: $VERSION_CODE)"

        NOTES=$(printf '# Note Counter Pro v%s (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: %s (versionCode: %s)\n- Flutter: 3.35.5\n- Target SDK: 36\n\n## Recent changes (v3.13.3)\n- Auto-hide Payable/Receivable toggle when counting notes (small Show button to bring back)\n- Smaller note widget UI for better fit (more notes visible without scrolling)\n- Added localization for "Show" button (English / Bengali / Hindi)\n- Test mode: real ads OFF (useTestAds = true) for testing before going live\n\nVersion: %s (versionCode: %s)' "$VERSION" "$VERSION" "$VERSION_CODE" "$VERSION" "$VERSION_CODE")

        # Check if release with same tag already exists, if so delete it first
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists, deleting old release..."
          gh release delete "$TAG" --yes
          # Also delete the tag
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
        fi

        gh release create "$TAG" \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v${VERSION} (Flutter - Hide Toggle + Smaller Notes + Test Mode)" \
          --notes "$NOTES" \
          --latest
