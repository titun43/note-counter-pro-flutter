name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses
        sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create || true

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.9.0 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.9.0 (versionCode: 65)\n- Flutter: 3.35.5\n- Target SDK: 36\n\n## Major Update: Personal Bahi Khata Book Redesign\n\n### Khata Page — Complete Redesign\nThe Khata page now looks like a real personal bahi khata (notebook):\n\n1. **Hardcover Header**: Maroon/brown gradient header with golden text "আমার খাতা" + total stats\n2. **Paper Page Background**: Cream-colored paper with subtle blue ruled lines\n3. **Red Margin Line**: Vertical red line on left side (like real khata)\n4. **Handwritten Font**: LXGW WenKai font for khata-style text\n5. **Customer Entries**: Numbered list (1. 2. 3.) with name + balance\n6. **Privacy Mask**: Phone numbers masked (••••12)\n7. **Call/WhatsApp Buttons**: Inline on each customer entry\n8. **Sort Options**: By balance, name, recent, or date added\n9. **Search Bar**: Real-time search by name/phone/notes\n10. **Monthly Summary Card**: Shows current month transactions, amounts given/taken, new customers\n\n### Customer Detail Page — Khata Page Style\n1. **Page Number**: "পাতা নং: 3" at top\n2. **Settled Stamp**: Red/green stamp when balance is zero\n3. **Table Format**: Date | Description | Took (green) | Gave (red)\n4. **Handwritten Style**: All text in khata handwriting font\n5. **Date Picker**: Select date when adding/editing transactions (past transactions supported)\n6. **Settle Up Button**: One-tap settle to zero out balance\n7. **Share Page**: Share entire customer statement as text\n8. **WhatsApp Reminder**: Pre-filled reminder message in user language\n9. **Call Button**: Direct call from detail page\n10. **Total Row**: Bold underlined totals at bottom of transaction table\n\n### New Features\n- **WhatsApp Reminder**: Pre-filled message "Hello [name], you have ₹[amount] due..." in EN/BN/HI\n- **Date Picker for Transactions**: Add past transactions with custom date\n- **Sort Options**: 4 sort modes for customer list\n- **Privacy Phone Masking**: Phone numbers partially hidden in list view\n- **Settled Stamp**: Visual stamp when account is settled\n- **Monthly Summary**: Auto-calculated monthly stats\n- **Share Full Page**: Share entire customer statement\n- **Settle Up**: One-tap settlement\n\n### New Localization Keys (EN/BN/HI)\n- searchCustomer, monthlySummary, totalTransactions, amountGiven, amountTaken\n- newCustomers, settled, accountSettled, pageNo\n- whatsappReminder, sendReminder, reminderMsg (with name/amount params)\n- sharePage, took, gave, description, callCustomer, whatsappCustomer\n- sortBy, sortBalance, sortName, sortRecent, sortDate\n- noPhone, lastTxn, myKhata, customersCount, pendingAmount\n\n### Font Added\n- LXGW WenKai (handwriting style) bundled as KhataHandwriting font family')
        gh release create v3.9.0-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.9.0 (Flutter - Personal Bahi Khata Book Redesign)" \
          --notes "$NOTES" \
          --latest
