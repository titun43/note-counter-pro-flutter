name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.2.0 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.2.0 (versionCode: 41)\n- Technology: Flutter (Dart)\n\n## 🆕 Features in 3.2.0\n\n### 1. Full Language Localization\n- ALL 9 screens now use localized strings\n- Changing language in Settings updates entire app:\n  - Home Screen: Payable, Receivable, Target, Other, Online, Save In, Save Out, Notes, Total, Grand Total\n  - Calculator: title, From Counter label\n  - Customers: title, search, add, empty state\n  - Customer Detail: Balance, Credit, Debit, Amount, Notes, Cancel, Save\n  - Khata: all labels (already done)\n  - Bills: title, empty state\n  - Reports: title, This Week/Month/All Time, Recent Transactions\n  - Settings: all sections and labels\n  - UPI QR: all field labels\n  - Bottom Nav: Counter, Calculator, Khata, Settings\n- 3 languages: English, Bengali, Hindi\n\n### 2. AdMob Integration\n- AdMob safely initialized in main() with try-catch\n- Banner ads ready (loaded in background)\n- Interstitial ads ready (can be shown on actions)\n- Wont crash if AdMob fails to initialize\n- AdMob App ID: ca-app-pub-1742730064755213~6546486804\n\n## Features\n- Note Counter (collapsible fields, inline editable, localized)\n- Calculator (bottom nav, correct currency, localized)\n- Customer Management (premium UI, add from contacts, edit/delete)\n- Khata (premium UI, long-press edit/delete, localized)\n- Bills, Reports, UPI QR, CSV Export (all localized)\n- Settings (language works across entire app, theme)\n- AdMob (banner + interstitial)\n- Dark/Light theme\n- Multi-language (English, Bengali, Hindi)')
        gh release create v3.2.0-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.2.0 (Flutter - Full Localization + AdMob)" \
          --notes "$NOTES" \
          --latest
