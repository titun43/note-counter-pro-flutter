name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses
        sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.7.0 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.7.0 (versionCode: 60)\n- Flutter: 3.35.5\n- NDK: 27.0.12077973\n- Target SDK: 36\n\n## New Features in 3.7.0\n\n### 1. Cash Receipt (Personal)\n- Save In/Out generates a personal receipt\n- Receipt shows date, time, name, note, breakdown, total\n- Shareable via WhatsApp\n\n### 2. Name and Note on Save\n- Save In/Out asks for Name and Note\n- Saved with transaction in History\n\n### 3. Share Receipt\n- Share receipt as text via WhatsApp/Email')
        gh release create v3.7.0-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.7.0 (Flutter - Cash Receipt)" \
          --notes "$NOTES" \
          --latest
