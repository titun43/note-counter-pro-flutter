name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.5.1 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.5.1 (versionCode: 55)\n- Signing: Upload key (Play Store ready)\n\n## 🆕 Fixes in 3.5.1\n\n### 1. Calculator History Bug Fixed\n- Was showing closure text instead of result\n- _formatResult was not being called properly\n- Now shows clean: 5+3 = 8\n\n### 2. New Multi-Currency App Icon\n- Old icon had rupee symbol (wrong for multi-currency app)\n- New icon: stacked colored notes/bills design (gold, green, blue)\n- NCP text at bottom\n- Dark navy background matching app theme\n- No currency-specific symbol\n- All mipmap densities generated\n- Also updated splash screen logo\n\n## Features\n- Note Counter (note-style, collapsible, inline editable)\n- Calculator (history fixed, no title)\n- Customer Management, Khata, Bills, Reports\n- App Lock (Fingerprint/PIN)\n- UPI QR, CSV Export\n- Banner Ads + Interstitial Ads\n- Localization EN/BN/HI\n- Dark/Light theme\n- New Multi-Currency App Icon\n- Splash Screen\n- Signed AAB (Play Store ready)')
        gh release create v3.5.1-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.5.1 (Flutter - New Icon + History Fix)" \
          --notes "$NOTES" \
          --latest
