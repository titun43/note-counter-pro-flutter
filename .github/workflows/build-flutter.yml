name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.0.4 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.0.4 (versionCode: 34)\n- Technology: Flutter (Dart)\n\n## 🆕 Fixes in 3.0.4\n\n### 1. Currency selector RESTORED on Home screen\n- User requested: AGER ETA THIK CHILO (previous was fine)\n- Currency dropdown is back on Home screen\n- Removed currency selector from Settings page\n- Settings no longer has Currency section\n\n### 2. Count inline editable (no dialog box)\n- User requested: EXTA BOX LAGBE NA, JETA AKHON KHULCHE\n- Removed the dialog popup\n- Count display is now a TextField - tap and type directly\n- No extra box/dialog opens\n- Soft keyboard appears when you tap the count\n- Type any number (3, 4, 5, 100) and it applies immediately\n- Visual: amber border around count field\n\n### 3. Calculator shows correct currency symbol\n- User requested: COUNTER THEKE JOKHON CALCULETOR AMOUNT JAI SETA JEI CURRANCY JEI RUPI HOLE RUPEE ER, ARE DOLLER HOLE DOLLER, ETC\n- Calculator now receives currency code from Counter\n- Display shows correct symbol: ₹ for INR, $ for USD, € for EUR, £ for GBP, ৳ for BDT, रू for NPR\n- From Counter indicator also shows correct symbol\n\n### 4. Premium UI - Customers screen\n- Premium gradient avatar with shadow\n- Card elevation 3, rounded corners\n- Better typography\n- Status badges (Credit/Debit) with colored backgrounds\n- Phone number with icon\n- Extended FAB: Add Customer\n- Search bar with fill color\n- Empty state with large icon\n\n### 5. Premium UI - Khata screen\n- Gradient summary cards (red for To Give, green for To Take)\n- Shadow effects on cards\n- Pending count badge\n- Premium list items with circular icons\n- Better spacing and typography\n\n## Features\n- Note Counter (vertical list, inline editable counts, currency selector)\n- Calculator (correct currency symbol, receives amount)\n- Customer Management (premium UI)\n- Khata (premium UI with gradient cards)\n- Bills\n- Reports\n- UPI QR Code generation\n- CSV Export\n- Rate Us / Share App\n- Settings (language, theme, etc.)\n- Dark/Light theme')
        gh release create v3.0.4-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.0.4 (Flutter - Premium UI + Currency Fix)" \
          --notes "$NOTES" \
          --latest
