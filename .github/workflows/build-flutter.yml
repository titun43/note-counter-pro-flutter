name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.0.5 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.0.5 (versionCode: 35)\n- Technology: Flutter (Dart)\n\n## 🆕 Layout Redesign in 3.0.5\n\n### Removed from top (AppBar)\n- Removed Note Counter Pro title\n- Removed Bills button\n- Removed Settings button\n- More space for counting interface\n\n### Top row (compact, all in one)\n- Currency selector (compact, just code: INR/USD/etc)\n- Notes count badge\n- Clear button (moved here from AppBar)\n- Grand Total badge (amber)\n\n### Bottom navigation (5 items)\n- Counter (home)\n- Customers\n- Khata\n- Bills\n- Settings\n\n### Calculator access\n- Calculator is accessed via calculator icon in action bar\n- Still receives amount and currency from Counter\n\n### QR access\n- QR icon moved to action bar (between Calculator and Save Out)\n\n### Reports access\n- Reports moved to Settings > Quick Actions > Reports\n\n## Features\n- Note Counter (no AppBar, more space, inline editable counts)\n- Calculator (from action bar, correct currency symbol)\n- Customer Management (premium UI)\n- Khata (premium UI with gradient cards)\n- Bills\n- Reports (from Settings)\n- UPI QR Code (from action bar)\n- CSV Export (from Settings)\n- Rate Us / Share App (from Settings)\n- Settings (bottom nav, full customization)\n- Dark/Light theme')
        gh release create v3.0.5-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.0.5 (Flutter - Layout Redesign)" \
          --notes "$NOTES" \
          --latest
