name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.4.0 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.4.0 (versionCode: 51)\n- Signing: Upload key (Play Store ready)\n\n## 🆕 Features in 3.4.0\n\n### 1. Note-Style Denomination Buttons\n- Each denomination now looks like a real currency note\n- Flutter-drawn note design (no copyright issues):\n  - Gradient background with currency-specific color\n  - Currency symbol watermark in center\n  - Value in corners (top-left normal, bottom-right rotated)\n  - Large value in center with shadow\n  - Border frame like real notes\n- Colors match real currency (INR: 500=gray-blue, 100=lavender, etc.)\n- Currency-specific colors for USD, EUR, GBP, BDT, NPR\n- No real images - all Flutter widgets (zero copyright risk)\n\n### 2. Interstitial Ads on Multiple Actions\n- Save In / Save Out (already had)\n- Page change: every 3 navigations shows 1 interstitial\n- UPI QR generation: shows interstitial after QR created\n- Total: 3 trigger points for interstitial ads\n\n### 3. Banner Ad Position Fixed\n- Banner ad at top, properly positioned\n- Shows on all pages (Counter, Calculator, Khata, Settings)\n\n## Features\n- Note Counter (note-style denomination buttons)\n- Calculator (bottom nav, currency symbol)\n- Customer Management (contacts, edit/delete)\n- Khata (premium UI, add/edit/delete)\n- Bills, Reports, UPI QR, CSV Export\n- Banner Ads (top, all pages)\n- Interstitial Ads (Save, Page change, QR)\n- Localization EN/BN/HI\n- Dark/Light theme\n- App Icon + Splash Screen\n- Signed AAB (Play Store ready)')
        gh release create v3.4.0-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.4.0 (Flutter - Note Design + Ads)" \
          --notes "$NOTES" \
          --latest
