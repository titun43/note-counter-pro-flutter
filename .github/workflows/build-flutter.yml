name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.5.0 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.5.0 (versionCode: 54)\n- Signing: Upload key (Play Store ready)\n\n## 🆕 New Feature in 3.5.0\n\n### App Lock (Fingerprint / PIN)\n- Settings > Appearance > App Lock toggle\n- When enabled: app requires fingerprint or PIN to open\n- When disabled: app opens directly (default)\n- User choice - optional security feature\n- Uses local_auth package (Android BiometricPrompt)\n- Falls back to device PIN if no fingerprint\n- Lock screen with app logo and unlock button\n- Auto-triggers biometric on app launch\n\n### Technical Changes\n- Changed MainActivity from FlutterActivity to FlutterFragmentActivity\n  (required by local_auth for biometric prompt)\n- Added USE_BIOMETRIC and USE_FINGERPRINT permissions\n- AppLockWrapper handles lock/unlock state\n- LockScreen widget with gradient background and fingerprint icon\n\n## Features\n- Note Counter (note-style, collapsible, inline editable)\n- Calculator (no title, history button)\n- Customer Management (contacts, edit/delete)\n- Khata (no title, premium UI, add/edit/delete)\n- Bills, Reports, UPI QR, CSV Export\n- App Lock (Fingerprint/PIN - optional)\n- Banner Ads (SafeArea) + Interstitial Ads\n- Localization EN/BN/HI\n- Dark/Light theme\n- App Icon + Splash Screen\n- Signed AAB (Play Store ready)')
        gh release create v3.5.0-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.5.0 (Flutter - App Lock)" \
          --notes "$NOTES" \
          --latest
