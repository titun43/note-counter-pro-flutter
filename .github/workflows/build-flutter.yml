name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses
        sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create || true

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.10.0 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.10.0 (versionCode: 67)\n- Flutter: 3.35.5\n- Target SDK: 36\n\n## Major Feature: Data Backup & Restore\n\nYour data is now safe! Full backup/restore system implemented.\n\n### 1. Manual JSON Backup\n- Settings > Backup & Restore > Backup Data\n- Creates versioned JSON with all data (entries, customers, bills, qrHistory, settings)\n- Share to WhatsApp, Email, Google Drive, or any app\n\n### 2. Restore from JSON\n- Pick any backup JSON file\n- Confirmation dialog + safety backup before restore\n- Migration support for future schema changes\n\n### 3. Auto Local Backup (Background)\n- Every data change triggers auto-backup (debounced 5s)\n- Saved to app documents directory\n- Keeps last 7 backups\n- Fully automatic\n\n### 4. Restore from Local Auto-Backup\n- Lists all local backups with timestamp\n- Tap any to restore\n\n### 5. Backup Info Card\n- Shows last backup time\n- Never backed up warning\n\n### Existing User Data Safe\n- No data loss for existing users\n- Backup is additive\n- User can optionally backup/restore anytime\n\n### New Dependencies\n- file_picker: ^6.1.1')
        gh release create v3.10.0-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.10.0 (Flutter - Data Backup & Restore)" \
          --notes "$NOTES" \
          --latest
