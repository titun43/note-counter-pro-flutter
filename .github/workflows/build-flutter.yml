name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.2.1 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (signed with upload key if secrets set)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.2.1 (versionCode: 42)\n- Technology: Flutter (Dart)\n\n## 🆕 Fixes in 3.2.1\n\n### Crash Fix\n- AdMob completely disabled (was causing crash on startup)\n- Removed google_mobile_ads dependency\n- Removed AdMob meta-data from AndroidManifest\n- Removed play-services-ads from build.gradle\n- App now starts cleanly without any native crashes\n\n### Signing\n- Workflow now checks for KEYSTORE_BASE64 secret\n- If secret exists, AAB is signed with upload key (Play Store ready)\n- If not, uses debug signing (for testing only)\n\n## Features\n- Note Counter (collapsible fields, inline editable, localized)\n- Calculator (bottom nav, correct currency, localized)\n- Customer Management (premium UI, add from contacts, edit/delete)\n- Khata (premium UI, long-press edit/delete, localized)\n- Bills, Reports, UPI QR, CSV Export (all localized)\n- Settings (language works across entire app, theme)\n- Dark/Light theme\n- Multi-language (English, Bengali, Hindi)\n- AdMob: Disabled (will re-enable later)')
        gh release create v3.2.1-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.2.1 (Flutter - Crash Fix)" \
          --notes "$NOTES" \
          --latest
