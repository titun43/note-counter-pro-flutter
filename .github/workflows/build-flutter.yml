name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses
        sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create || true

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.10.1 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.10.1 (versionCode: 68)\n- Flutter: 3.35.5\n- Target SDK: 36\n\n## Fixes in 3.10.1 — Restored Lost Features\n\nPrevious force push accidentally removed v3.7-v3.9 features. All restored:\n\n### 1. Name/Note Dialog on Save In/Out\n- Save In/Out click now shows a dialog first\n- User can enter Name (From whom / To whom)\n- User can enter Note (What for)\n- Localized labels (EN/BN/HI)\n- Cancel/Save buttons\n- Entry is saved with customerName field\n\n### 2. Receipt Dialog After Save\n- After saving, a receipt dialog appears:\n  - CASH IN / CASH OUT header (green/red)\n  - Name, Note, Type, Total Notes\n  - Denomination Breakdown (value x count = subtotal)\n  - Other Amount, Online Amount\n  - GRAND TOTAL\n  - Close + Share buttons\n- Share receipt as text (WhatsApp, SMS, etc.)\n- Values saved before reset (no more 0 bug)\n\n### 3. History Button in Action Bar\n- History icon button restored between Calc and QR\n- Compact 40px IconButtons to fit 5 items\n- Click to open History bottom sheet\n\n### 4. History Bottom Sheet (2 tabs)\n- Tab 1: Save In/Out History\n  - Last 20 entries with amount, type badge, name, date\n  - Tap entry to view full receipt dialog\n  - Share icon on each entry\n  - Chevron right as visual cue\n- Tab 2: QR Code History\n  - Last QR generations with name, UPI ID, amount\n  - Tap to open QR screen\n  - Share icon on each entry\n\n### 5. History Receipt Dialog\n- Tap any history entry to see full receipt\n- Shows all details: name, type, notes, denominations, grand total\n- Close + Share buttons\n\n### 6. Share History Entry\n- Share any past entry as receipt text\n- WhatsApp/SMS compatible\n- Includes denomination breakdown\n\nVersion: 3.10.1 (versionCode: 68)')
        gh release create v3.10.1-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.10.1 (Flutter - Restored Name/Note + Receipt + History)" \
          --notes "$NOTES" \
          --latest
