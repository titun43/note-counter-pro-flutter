name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.0.2 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.0.2 (versionCode: 32)\n- Technology: Flutter (Dart)\n\n## 🆕 Major UI Improvements in 3.0.2\n\n### Redesigned Home Screen (like original app)\n- Denomination buttons now in VERTICAL LIST (not grid)\n- Each row: colored denomination button + [-] count [+] + subtotal\n- Currency selector at top (dropdown)\n- Transaction type toggle: Payable / Receivable\n- Target Amount input field\n- Other Amount + Online Amount input fields\n- Cash Total + Other + Online summary boxes at bottom\n- Grand Total display at bottom\n\n### Currency Switching NOW WORKS\n- Switching between INR/USD/EUR/GBP/BDT/NPR actually changes denominations\n- Each currency has its own set of denominations:\n  - INR: 2000, 500, 200, 100, 50, 20, 10, 5, 2, 1\n  - USD: 100, 50, 20, 10, 5, 2, 1\n  - EUR: 500, 200, 100, 50, 20, 10, 5, 2, 1\n  - GBP: 50, 20, 10, 5, 2, 1\n  - BDT: 1000, 500, 200, 100, 50, 20, 10, 5, 2, 1\n  - NPR: 1000, 500, 100, 50, 20, 10, 5, 2, 1\n- Currency symbol updates everywhere (₹, $, €, £, ৳, रू)\n- Selected currency saved to settings\n\n### Send to Calculator\n- New calculator icon button in action bar\n- Sends current grand total to Calculator screen\n- Calculator shows "From Counter: ₹XXX" indicator\n- Can continue calculations from there\n\n### Save In / Save Out\n- Save In (green) - for cash received\n- Save Out (red) - for cash paid\n- Saves entry with denomination counts, other/online amounts\n- Transaction type (Payable/Receivable) recorded\n\n## Features\n- Note Counter (multi-currency, vertical list)\n- Calculator (receives amount from counter)\n- Customer Management\n- Khata (Lend/Borrow)\n- Bills\n- Reports\n- UPI QR Code generation\n- CSV Export\n- Rate Us / Share App\n- Settings with full customization\n- Dark/Light theme')
        gh release create v3.0.2-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.0.2 (Flutter - Major UI Fix)" \
          --notes "$NOTES" \
          --latest
