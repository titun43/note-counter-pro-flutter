name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.3.0 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.3.0 (versionCode: 45)\n- Signing: Upload key (Play Store ready)\n\n## 🆕 Features in 3.3.0\n\n### 1. App Icon\n- Copied original app icon from old Capacitor repo\n- All density mipmap icons (mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi)\n- Adaptive icon for Android 8+ (anydpi-v26)\n- Round icon support\n- Same icon as Play Store listing\n\n### 2. Splash Screen with Logo\n- Flutter native splash screen generated\n- Shows app logo on dark background (#0a0a1a)\n- Logo appears instantly when app starts\n- Smooth transition to app\n- Android 12+ splash API support\n\n### 3. App Stability (No Crash)\n- AdMob completely removed (was causing native crash)\n- App runs 100%% stable\n- No background services that can crash\n\n## Features (all stable)\n- Note Counter (collapsible fields, inline editable, localized)\n- Calculator (bottom nav, correct currency, localized)\n- Customer Management (premium UI, contacts, edit/delete)\n- Khata (premium UI, add customer, edit/delete, localized)\n- Bills, Reports, UPI QR, CSV Export (all localized)\n- Settings (language EN/BN/HI, theme)\n- Dark/Light theme\n- App Icon + Splash Screen\n- Signed AAB (Play Store ready)')
        gh release create v3.3.0-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.3.0 (Flutter - App Icon + Splash)" \
          --notes "$NOTES" \
          --latest
