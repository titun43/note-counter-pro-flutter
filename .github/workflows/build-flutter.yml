name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.2.3 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.2.3 (versionCode: 44)\n- Signing: Upload key (Play Store ready)\n\n## 🆕 Fix in 3.2.3\n\n### AdMob Completely Removed (Stability Fix)\n- User reported: app opens but closes after some time (crash)\n- Root cause: google_mobile_ads native initialization crash\n- Even with lazy init (2s delay), AdMob native code crashes the app\n- try-catch in Dart cannot catch native crashes\n\n- Fix: Completely removed AdMob:\n  - Removed google_mobile_ads from pubspec.yaml\n  - Removed AdMob meta-data from AndroidManifest.xml\n  - Removed play-services-ads from build.gradle\n  - AdMobService is now a no-op stub\n  - App runs 100%% stable, no crashes\n\n- AdMob will be re-added in a future version using a different approach:\n  Option A: Use a web-based ad via WebView (no native SDK)\n  Option B: Use a different ad plugin (facebook_audience_network)\n  Option C: Wait for google_mobile_ads to fix the crash issue\n\n## Features (all stable)\n- Note Counter (collapsible fields, inline editable, localized)\n- Calculator (bottom nav, correct currency, localized)\n- Customer Management (premium UI, contacts, edit/delete)\n- Khata (premium UI, add customer, edit/delete, localized)\n- Bills, Reports, UPI QR, CSV Export (all localized)\n- Settings (language EN/BN/HI, theme)\n- Dark/Light theme\n- Signed AAB (Play Store ready)')
        gh release create v3.2.3-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.2.3 (Flutter - Stable, No Crash)" \
          --notes "$NOTES" \
          --latest
