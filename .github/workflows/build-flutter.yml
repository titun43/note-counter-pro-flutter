name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses
        sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" || true

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create || true

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.12.2 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.12.2 (versionCode: 77)\n- Flutter: 3.35.5\n- Target SDK: 36\n\n## Fix: PDF Broken Symbols\n\n### Problem\nPDF was showing broken mail-icon-like symbols instead of:\n1. Rupee symbol (₹) before amounts\n2. Phone emoji (📞) and location emoji (📍) in header\n\n### Root Cause\nPDF default font (Helvetica) does not support:\n- Indian Rupee glyph (₹)\n- Emoji characters (📞, 📍)\nThese render as broken/missing character boxes that look like mail icons.\n\n### Fix\n1. Created _pdfCurrencySymbol() method that returns PDF-safe currency strings:\n   - INR → "Rs." (instead of ₹)\n   - USD → "$"\n   - EUR → "EUR"\n   - GBP → "GBP"\n   - BDT → "Tk."\n   - NPR → "Rs."\n2. Replaced all AppConstants.getCurrencySymbol() calls in PDF with _pdfCurrencySymbol()\n3. Replaced 📞 emoji with "Phone:" text\n4. Replaced 📍 emoji with "Address:" text\n\nNow PDF shows clean text without any broken symbols.\n\nVersion: 3.12.2 (versionCode: 77)')
        gh release create v3.12.2-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.12.2 (Flutter - PDF Symbol Fix)" \
          --notes "$NOTES" \
          --latest
