name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses
        sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" || true

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create || true

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.12.1 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.12.1 (versionCode: 76)\n- Flutter: 3.35.5\n- Target SDK: 36\n\n## Professional PDF + Share as Image\n\n### 1. Professional PDF Redesign\nBoth Khata PDF and Customer Statement PDF now have:\n- Professional maroon header bar with business name + golden text\n- Business contact info (phone, address) under header\n- Color-coded summary cards (red for To Give, green for To Take)\n- Professional table with maroon header row + golden text\n- Alternating row colors\n- Footer with page numbers + UPI ID\n- Proper spacing and borders\n\n### 2. Customer PDF — Actual QR Code Image\n- Payment QR now renders as actual QR code image (not text)\n- Uses QrPainter to generate QR image bytes\n- Embedded in PDF with "Scan to Pay" label + amount\n- Only shows if business UPI ID is set + customer has balance\n\n### 3. Customer "Share This Page" — Now Shares as Image\n- Previously shared as text\n- Now builds a professional receipt widget\n- Captures as PNG image using Screenshot + Overlay\n- Shares image to WhatsApp/Email/etc.\n- Fallback to text if image capture fails\n\n### Changes:\n- pdf_service.dart: Complete redesign with professional layout, QR image generation\n- customer_detail_screen.dart: _sharePage now captures widget as image, _buildShareableReceipt, _captureWidget\n\nVersion: 3.12.1 (versionCode: 76)')
        gh release create v3.12.1-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.12.1 (Flutter - Professional PDF + Share as Image)" \
          --notes "$NOTES" \
          --latest
