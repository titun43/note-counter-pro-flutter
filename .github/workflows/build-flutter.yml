name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.0.9 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.0.9 (versionCode: 39)\n- Technology: Flutter (Dart)\n\n## 🆕 Fixes in 3.0.9\n\n### 1. Contact Picker Permission Fix\n- Added permission_handler package for runtime permission requests\n- ContactPickerService now requests READ_CONTACTS permission before picking\n- User gets system dialog: Allow access to contacts?\n- If denied, shows friendly error message\n- If granted, contact picker opens normally\n- No more Permission Denial crash\n\n### 2. Target Amount vs Actual Total Comparison\n- User requested: TARGET AMOUNT ER SATHE ACTUAL TOTAL COMPARE HOBE\n- When Target Amount is entered, a comparison card appears:\n  - Shows Target amount\n  - Shows Actual total (Cash + Other + Online)\n  - Shows difference (surplus or shortfall)\n  - Green card with check icon if target reached (surplus)\n  - Red card with warning icon if short of target\n  - Real-time updates as you count notes\n- Example:\n  Target: ₹5000\n  Actual: ₹3500\n  Need: ₹1500 more (red card)\n  \n  Target: ₹5000\n  Actual: ₹5500\n  Surplus: ₹500 (green card)\n\n## Features\n- Note Counter with Target comparison\n- Calculator (bottom nav)\n- Khata (contact picker with permission)\n- Settings (language, theme, quick actions)\n- UPI QR Code, CSV Export, Bills, Reports\n- Dark/Light theme\n- Multi-language (English, Bengali, Hindi)')
        gh release create v3.0.9-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.0.9 (Flutter - Permission + Target Compare)" \
          --notes "$NOTES" \
          --latest
