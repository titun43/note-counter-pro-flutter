name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.0.3 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.0.3 (versionCode: 33)\n- Technology: Flutter (Dart)\n\n## 🆕 Fixes in 3.0.3\n\n### 1. Currency selector removed from Home screen\n- User requested: CURRENCY TA LAGBE NA, SETA UTHAI DAO\n- Removed the currency dropdown from top of Home screen\n- Currency can still be changed from Settings (less clutter on main screen)\n- Cleaner, more focused counting interface\n\n### 2. Count display now tappable\n- User requested: NOTE NOTE ER EKAHNE 0 TE CLICK KORA JACHCHE NA, JEMON AKBARE 3/4/5 ER NOROM KEYBORD THEKE\n- The count number (showing 0) is now TAPPABLE\n- Tap on it opens a dialog with number input\n- Soft keyboard appears with number pad\n- Type any number (3, 4, 5, 100, etc.) directly\n- Set button applies the count\n- Clear button resets to 0\n- Faster than tapping + button multiple times\n\n### 3. Settings improvements\n- All settings now properly use context.watch for reactive updates\n- Language picker works correctly\n- Currency picker in Settings works\n- Dark mode toggle works\n- Haptic feedback toggle works\n\n## Features\n- Note Counter (vertical list, tappable counts)\n- Calculator (receives amount from counter)\n- Customer Management\n- Khata (Lend/Borrow)\n- Bills\n- Reports\n- UPI QR Code generation\n- CSV Export\n- Rate Us / Share App\n- Settings (currency, language, theme, etc.)\n- Dark/Light theme')
        gh release create v3.0.3-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.0.3 (Flutter - Settings + Count Fix)" \
          --notes "$NOTES" \
          --latest
