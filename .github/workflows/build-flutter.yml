name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.1.0 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.1.0 (versionCode: 40)\n- Technology: Flutter (Dart)\n\n## 🆕 Features in 3.1.0\n\n### 1. Collapsible Extra Fields (Option C)\n- Target Amount, Other Amount, Online Amount now HIDDEN by default\n- More space for denomination list when not needed\n- "More (Target / Other / Online)" button appears when all are empty\n- Tap "More" to expand and show all three fields\n- Clear button (X) on each field to quickly clear and hide\n- Fields auto-show if they have any input value\n- Hide button (up arrow) to collapse back\n\n### 2. Long-press Edit/Delete (Option A)\n- Khata screen: Long-press any customer → bottom sheet with Edit/Delete\n  - Edit: modify name, phone, email, address\n  - Delete: removes customer + all related transactions (with confirmation)\n- Customer Detail screen: Long-press any transaction → bottom sheet\n  - Edit: modify amount and notes\n  - Delete: removes transaction, updates customer balance (with confirmation)\n- Both use Material bottom sheet for natural UX\n- Confirmation dialogs prevent accidental deletion\n\n## Features\n- Note Counter with collapsible extra fields\n- Calculator (bottom nav, correct currency symbol)\n- Khata (premium UI, add from contacts, long-press edit/delete)\n- Customer Detail (long-press transaction edit/delete)\n- Settings (language works, theme, quick actions)\n- UPI QR Code, CSV Export, Bills, Reports\n- Dark/Light theme\n- Multi-language (English, Bengali, Hindi)')
        gh release create v3.1.0-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.1.0 (Flutter - Collapsible Fields + Edit/Delete)" \
          --notes "$NOTES" \
          --latest
