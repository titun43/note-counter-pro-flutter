name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.4.1 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.4.1 (versionCode: 52)\n- Signing: Upload key (Play Store ready)\n\n## 🆕 Fixes in 3.4.1\n\n### 1. Note Widget Fixed (no duplicate, no upside down)\n- Removed duplicate value text (was showing in center + corners)\n- Now shows single clean value in center with shadow\n- Gradient background + border frame remains\n- Colors still match real currency per denomination\n\n### 2. Calculator Redesigned\n- Removed AppBar title (Calculator text removed)\n- More space for calculator display and buttons\n- Added History button (top-right, toggle on/off)\n- History panel shows recent calculations\n- Collapsible - tap history icon to show/hide\n- Initial value from counter shown compactly at top\n\n### 3. Banner Ad Position\n- Already at top, shows on all pages\n\n## Features\n- Note Counter (note-style denomination, single value)\n- Calculator (no title, history button, more space)\n- Customer Management, Khata, Bills, Reports\n- UPI QR, CSV Export\n- Banner Ads (top) + Interstitial Ads (Save, Page change, QR)\n- Localization EN/BN/HI\n- Dark/Light theme\n- App Icon + Splash Screen\n- Signed AAB (Play Store ready)')
        gh release create v3.4.1-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.4.1 (Flutter - Note Fix + Calculator)" \
          --notes "$NOTES" \
          --latest
