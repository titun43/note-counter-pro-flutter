name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.3.4 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.3.4 (versionCode: 49)\n- Signing: Upload key (Play Store ready)\n\n## 🆕 Fixes in 3.3.4\n\n### 1. Banner Ads Now Display\n- Created BannerAdWidget that shows ads on Home screen\n- Widget loads ad independently with retry logic\n- Ad appears at bottom of counter screen\n- If AdMob not ready, retries every 2 seconds\n\n### 2. Language List Cleaned\n- Removed: Assamese, Kannada, Malayalam, Marathi, Punjabi\n- Kept only: English, Bengali (বাংলা), Hindi (हिंदी)\n- These 3 have full translations\n- No more broken language switching\n\n### 3. Splash Screen Fixed\n- Better color: #1A1A2E (matching app theme)\n- Added fullscreen mode\n- Added color_dark for dark theme\n- Logo properly centered\n\n## Features\n- App Icon + Splash Screen\n- AdMob (banner ads on Home screen)\n- Note Counter, Calculator, Customers, Khata, Bills, Reports\n- UPI QR, CSV Export\n- Localization EN/BN/HI (only 3)\n- Dark/Light theme\n- Signed AAB (Play Store ready)')
        gh release create v3.3.4-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.3.4 (Flutter - Ads + Language + Splash)" \
          --notes "$NOTES" \
          --latest
