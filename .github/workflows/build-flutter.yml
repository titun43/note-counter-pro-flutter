name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze || true

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.0.7 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Package: com.lokhnathtechnical.notecounterpro\n- Version: 3.0.7 (versionCode: 37)\n- Technology: Flutter (Dart)\n\n## 🆕 Features in 3.0.7\n\n### Custom Native Contact Picker (no third-party package)\n- Removed fluttercontactpicker package (had AGP 8.x namespace issues)\n- Built custom contact picker using Android MethodChannel\n- MainActivity.kt handles contact picking natively\n- ContactPickerService.dart communicates via MethodChannel\n- Opens native Android contact picker\n- Returns name and phone number\n- Same functionality, no dependency issues\n\n## Previous Features\n- Khata Add Customer: Pick from Contacts / Manual Add\n- Language Switching: English, Bengali, Hindi (full localization)\n- Note Counter with inline editable counts\n- Calculator with correct currency symbol\n- Premium UI for Customers, Khata\n- UPI QR Code, CSV Export, Rate Us\n- Dark/Light theme')
        gh release create v3.0.7-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.0.7 (Flutter - Native Contact Picker)" \
          --notes "$NOTES" \
          --latest
