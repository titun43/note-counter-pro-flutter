name: Build Flutter APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NDK
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses
        sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" || true

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.5'
        channel: stable
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Generate splash screen
      run: dart run flutter_native_splash:create || true

    - name: Analyze code
      run: flutter analyze || true

    - name: Set up signing (if keystore secret available)
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      if: env.KEYSTORE_BASE64 != ''
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/note-counter-pro.keystore
        echo "storeFile=note-counter-pro.keystore" > android/key.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons --target-platform android-arm,android-arm64,android-x64

    - name: Rename artifacts
      run: |
        mv build/app/outputs/flutter-apk/app-release.apk note-counter-pro.apk
        mv build/app/outputs/bundle/release/app-release.aab note-counter-pro.aab

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-apk
        path: note-counter-pro.apk

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: note-counter-pro-aab
        path: note-counter-pro.aab

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(printf '# Note Counter Pro v3.12.0 (Flutter)\n\n## Downloads\n\n- **note-counter-pro.aab** - AAB for Play Store upload (SIGNED)\n- note-counter-pro.apk - APK for direct install\n\n## Build Info\n- Version: 3.12.0 (versionCode: 75)\n- Flutter: 3.35.5\n- Target SDK: 36\n\n## New Features in v3.12.0\n\n### 1. ₹2000 Note Removed\n- ₹2000 denomination row removed from INR (note banned in India)\n- Remaining: ₹500, ₹200, ₹100, ₹50, ₹20, ₹10, ₹5, ₹2, ₹1\n\n### 2. History Delete Option\n- Save In/Out History: each entry has delete button (with confirmation)\n- QR Code History: each QR has delete button (with confirmation)\n- Delete updates immediately\n\n### 3. Business Details (Settings)\n- New "Business Details" option in Settings > Quick Actions\n- Save: Business Name, Owner Name, Phone, Address, UPI ID\n- These details appear on PDF shares\n- Replaced old "Bills" option\n\n### 4. Khata PDF Share\n- PDF icon button in Khata header\n- Generates PDF with all customers, balances, business details\n- Share to WhatsApp/Email/etc.\n\n### 5. Customer Page PDF Share\n- PDF icon button in Customer Detail app bar\n- Generates PDF with: business details, customer info, balance, transactions, payment QR (UPI link)\n- Share to WhatsApp/Email/etc.\n\n### New Files:\n- lib/services/pdf_service.dart (PDF generation)\n\n### Changes:\n- constants.dart: Removed ₹2000 from INR denominations\n- storage_service.dart: Added business details + QR history delete methods\n- home_screen.dart: Delete buttons in history tabs\n- settings_screen.dart: Business Details dialog\n- khata_screen.dart: PDF share button in header\n- customer_detail_screen.dart: PDF share button in app bar\n\nVersion: 3.12.0 (versionCode: 75)')
        gh release create v3.12.0-flutter \
          note-counter-pro.apk \
          note-counter-pro.aab \
          --title "Note Counter Pro v3.12.0 (Flutter - ₹2000 Remove + Delete + Business Details + PDF)" \
          --notes "$NOTES" \
          --latest
