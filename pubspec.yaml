name: note_counter_pro
description: Professional Cash Note Counter App - Multi-currency support with business mode
publish_to: 'none'
version: 3.22.3+114

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2

  # PDF Export
  pdf: ^3.10.7
  
  # Share & Files
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # URL Launcher
  url_launcher: ^6.2.1
  
  # Package Info
  package_info_plus: ^8.1.2

  # Permissions
  permission_handler: ^11.1.0

  # Fingerprint/Biometric lock
  local_auth: ^2.1.8

  # Splash screen
  flutter_native_splash: ^2.4.0

  # AdMob (stable version 3.x - no crash)
  google_mobile_ads: ^3.1.0

  # File picker (for restore backup)
  file_picker: ^8.1.2

  # Text-to-Speech (voice announcement on save)
  # Using 3.x for Kotlin 2.0.21 compatibility (4.x requires Kotlin 2.2+)
  flutter_tts: ^3.8.1

  # Screenshot (capture receipt as image for share)
  screenshot: ^3.0.0

  # Local notifications (for reminder scheduling)
  flutter_local_notifications: ^17.2.2

  # Time zone support for scheduled notifications
  flutter_timezone: ^3.0.1
  timezone: ^0.9.4

  # In-App Purchase (Premium subscription for ad-free experience)
  # Native Google Play Billing Library 8.1.0 already in android/app/build.gradle
  in_app_purchase: ^3.2.0

  # Cloud Backup (Google Drive) — premium feature
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  http: ^1.2.0

  # Bluetooth Receipt Printer — premium feature
  # Using _plus variants which are compatible with image 4.x
  esc_pos_printer_plus: ^0.1.1
  esc_pos_utils_plus: ^2.0.2

  # Refer & Earn — unique code generation
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  archive: ^3.6.1
  image: 4.1.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/

flutter_native_splash:
  color: "#1A1A2E"
  color_dark: "#1A1A2E"
  image: assets/icons/app_logo.png
  android_12:
    image: assets/icons/app_logo.png
    color: "#1A1A2E"
  android: true
  ios: false
  fullscreen: true
