name: note_counter_pro
description: Professional Cash Note Counter App - Multi-currency support with business mode
publish_to: 'none'
version: 3.13.3+83

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2

  # PDF Export
  pdf: ^3.10.7
  
  # Share & Files
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # URL Launcher
  url_launcher: ^6.2.1
  
  # Package Info
  package_info_plus: ^8.1.2

  # Permissions
  permission_handler: ^11.1.0

  # Fingerprint/Biometric lock
  local_auth: ^2.1.8

  # Splash screen
  flutter_native_splash: ^2.4.0

  # AdMob (stable version 3.x - no crash)
  google_mobile_ads: ^3.1.0

  # File picker (for restore backup)
  file_picker: ^8.1.2

  # Screenshot (capture receipt as image for share)
  screenshot: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  archive: ^3.6.1
  image: 4.1.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/

flutter_native_splash:
  color: "#1A1A2E"
  color_dark: "#1A1A2E"
  image: assets/icons/app_logo.png
  android_12:
    image: assets/icons/app_logo.png
    color: "#1A1A2E"
  android: true
  ios: false
  fullscreen: true
