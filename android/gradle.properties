org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.experimental.enableNewResourceShrinker=true
android.experimental.enableNewResourceShrinker.preciseShrinking=true
# 16 KB memory page size support (Google Play policy Nov 2025).
# Store .so files UNCOMPRESSED in the AAB so that 16 KB page alignment
# is preserved. When .so files are compressed, the alignment is lost
# and Play Console rejects the AAB with "does not support 16 KB memory
# page sizes". This flag is the official Google-recommended fix.
android.bundle.enableCompressedNativeLibs=false
